# The Deployment tells Kubernetes which image to run, how many copies to keep,
# how much CPU/memory each copy needs and how to check that it is healthy.
# IMAGE_URI is replaced with your ECR image when you deploy (see the README, Step 21).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwaku-store
  namespace: kwaku-store
  labels:
    app: kwaku-store
spec:
  replicas: 3                       # always keep 3 copies of the website running
  selector:
    matchLabels:
      app: kwaku-store
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0             # updates never reduce the number of ready pods
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kwaku-store
    spec:
      # Prefer to put the copies on different worker nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kwaku-store
      containers:
        - name: kwaku-store
          image: IMAGE_URI
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:               # reserved for each pod; the autoscaler measures CPU against this
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:           # only send customers to pods that answer
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:            # restart a container that stops answering
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
