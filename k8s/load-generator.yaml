# Test traffic for the autoscaling demo: each pod requests the website in a loop
# through the internal Service address. Delete it when the test is finished.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: kwaku-store
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O /dev/null http://kwaku-store-service; done"]
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
